<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Heirloom owner dashboard</title>
<style>:root{color-scheme:dark}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#07090f;color:#e8e6df;padding:16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 8px;color:#ffb020}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{background:#12161f;border:1px solid #232a38;border-radius:14px;padding:12px}.c b{display:block;font-size:30px;color:#ffb020}.c span{opacity:.7;font-size:13px}input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #333b4d;background:#12161f;color:#fff}button{background:#ffb020;color:#000;font-weight:700;border:0;cursor:pointer}.bars{display:flex;align-items:flex-end;gap:4px;height:110px}.bars i{flex:1;background:#2f80ed;border-radius:4px 4px 0 0;position:relative;min-height:2px}.bars i.s{background:#35e0b0}.lab{display:flex;gap:4px;font-size:10px;opacity:.6}.lab span{flex:1;text-align:center}.fb{border-bottom:1px solid #232a38;padding:8px 0}.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#232a38;margin-right:6px}.pl{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a1f2b}#login{max-width:340px;margin:60px auto;text-align:center}</style></head><body>
<div id="login"><h1>🔐 Owner dashboard</h1><p style="opacity:.7">Enter your ADMIN_KEY</p><input id="k" type="password" autocomplete="off" placeholder="admin key" style="width:100%;box-sizing:border-box"><p><button id="go">Open</button></p><p id="err" style="color:#ff6b6b"></p></div>
<div id="app" hidden><h1>Heirloom dashboard</h1><div style="opacity:.6;font-size:13px">Updates every 30 seconds · <a id="out" href="#" style="color:#ffb020">log out</a></div>
<div class="g" id="cards"></div><h2>New players and play sessions (last 14 days)</h2><div class="c"><div class="bars" id="bars"></div><div class="lab" id="lab"></div><div style="font-size:12px;margin-top:8px"><span style="color:#2f80ed">■</span> new players &nbsp; <span style="color:#35e0b0">■</span> play sessions</div></div>
<h2>Where players go</h2><div class="c" id="places"></div><h2>Money from sales</h2><div class="c" id="rev"></div><h2>Player feedback</h2><div class="c" id="fb"></div><h2>Suspended for cheating</h2><div class="c" id="flags"></div></div>
<script src="admin.js"></script></body></html>
