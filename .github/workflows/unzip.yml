name: Unpack Heirloom
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the game into the repo
        run: |
          unzip -o ./heirloom-netlify*.zip
          rm -f ./heirloom-netlify*.zip
          rm -rf .github
      - name: Commit the unpacked files
        run: |
          git config user.name "heirloom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Heirloom game files"
          git push
