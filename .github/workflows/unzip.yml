name: Unpack Heirloom
on:
  workflow_dispatch:
  push:
    paths:
      - 'heirloom-netlify.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -oq heirloom-netlify.zip
          rm heirloom-netlify.zip
      - name: Save files
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "Unpack Heirloom game files"
          git push
